{% extends "base.html" %}{% block title %}Sign in · InsightFlow{% endblock %}{% block auth_content %}<section class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to InsightFlow</h1><p class="muted">Continue to your data science workspace.</p>{% if error %}<p class="error-message">{{ error }}</p>{% endif %}<form method="post" class="field-form">{% csrf_token %}<label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label><button class="primary-button">Sign in</button></form><p class="auth-foot">New to InsightFlow? <a href="{% url 'signup' %}">Create an account</a></p></section>{% endblock %}
