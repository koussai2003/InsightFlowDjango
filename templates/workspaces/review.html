{% extends "app_base.html" %}
{% block title %}Dataset review{% endblock %}
{% block app_content %}
<div class="workspace-page">
  <header class="page-header">
    <div>
      <span class="eyebrow">WORKSPACE</span>
      <h1>Dataset review</h1>
    </div>
    <span class="status-pill"><i></i> Reviewer</span>
  </header>
  <div class="studio-body">
    <div class="welcome">
      <div class="studio-mark">🔍<span>✦</span></div>
      <span class="eyebrow">REVIEW WORKSPACE</span>
      <h2>Review<br><span>datasets</span></h2>
      <p>Comment, review decisions, and collaborate in your assigned project workspaces.</p>
      <div style="margin-top:20px;">
        <a href="/projects" style="display:inline-block;padding:12px 24px;background:var(--ink);color:white;border-radius:9px;font-weight:600;text-decoration:none;">
          Open Data Studio & Projects
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
